name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include version and architecture.
      placeholder: macOS 15, Apple silicon
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Konus version
      placeholder: 0.11.0
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: Media format and codec
      description: Include container and audio/video codecs, if relevant.
      placeholder: MP4, H.264 video, AAC audio
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps show the issue.

name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    env:
      QT_VERSION: '6.8.3'
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
      - name: Install libVLC (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask vlc
      - name: Install libVLC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.videolan.org/pub/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.7z -OutFile vlc.7z
          7z x vlc.7z
          "VLC_SDK_DIR=$((Get-Location).Path)/vlc-3.0.23/sdk" >> $env:GITHUB_ENV
      - name: Install libVLC (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc-plugin-base
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Windows' && format('-DVLC_SDK_DIR={0}/vlc-3.0.23/sdk', github.workspace) || '' }}
          cmake --build build --config Release --parallel
      - name: Run frame regression check
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build-fc -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCMAKE_BUILD_TYPE=Release -DKONUS_BUILD_FRAME_CHECK=ON
          cmake --build build-fc --config Release --target konus-frame-check --parallel
          ./build-fc/konus-frame-check
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/konus.app -qmldir=qml
          mkdir -p build/konus.app/Contents/Frameworks build/konus.app/Contents/PlugIns/vlc
          cp -L /Applications/VLC.app/Contents/MacOS/lib/libvlc*.dylib build/konus.app/Contents/Frameworks/
          cp -R /Applications/VLC.app/Contents/MacOS/plugins/. build/konus.app/Contents/PlugIns/vlc/
          ditto LICENSE build/konus.app/Contents/Resources/LICENSE
          ditto NOTICE build/konus.app/Contents/Resources/NOTICE
          ditto LICENSES build/konus.app/Contents/Resources/LICENSES
          ditto assets/icons/LICENSE-hugeicons.txt build/konus.app/Contents/Resources/LICENSE-hugeicons.txt
          ditto assets/fonts/OFL.txt build/konus.app/Contents/Resources/OFL.txt
          qt_notices=build/konus.app/Contents/Resources/upstream-notices/qt
          vlc_notices=build/konus.app/Contents/Resources/upstream-notices/vlc
          qt_version="$QT_VERSION"
          qt_series=${qt_version%.*}
          mkdir -p "$qt_notices" "$vlc_notices"
          if [ -d "$QT_ROOT_DIR/Licenses" ]; then ditto "$QT_ROOT_DIR/Licenses" "$qt_notices/Licenses"; fi
          while IFS= read -r -d '' file; do
            rel=${file#"$QT_ROOT_DIR/"}; mkdir -p "$qt_notices/$(dirname "$rel")"; cp "$file" "$qt_notices/$rel"
          done < <(find "$QT_ROOT_DIR" -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname '*third*party*' -o -iname 'copyright' \) -print0)
          while IFS= read -r -d '' file; do
            rel=${file#"/Applications/VLC.app/Contents/"}; mkdir -p "$vlc_notices/$(dirname "$rel")"; cp "$file" "$vlc_notices/$rel"
          done < <(find /Applications/VLC.app/Contents -type f \( -iname 'COPYING*' -o -iname 'copyright' \) -print0)
          vlc_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/VLC.app/Contents/Info.plist)
          printf 'Qt %s\nCorresponding source: https://download.qt.io/archive/qt/%s/%s/single/qt-everywhere-src-%s.tar.xz\n\nlibVLC and VLC plugins %s\nCorresponding source: https://download.videolan.org/pub/videolan/vlc/%s/\n' "$qt_version" "$qt_series" "$qt_version" "$qt_version" "$vlc_version" "$vlc_version" > build/konus.app/Contents/Resources/THIRD-PARTY-SOURCES.txt
          codesign --force --deep -s - build/konus.app
          cd build && zip -r ../konus-macos.zip konus.app
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "$(Get-Location)/build/Release"
          $vlc = "$(Get-Location)/vlc-3.0.23"
          windeployqt --release --qmldir qml "$stage/konus.exe"
          $redistRoot = $env:VCToolsRedistDir
          if (-not $redistRoot) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
            $vsInstall = & $vswhere -latest -products '*' -property installationPath
            if (-not $vsInstall) { throw 'Visual Studio installation not found by vswhere' }
            $redistRoot = Join-Path $vsInstall 'VC/Redist/MSVC'
          }
          $crt = Get-ChildItem $redistRoot -Directory -Filter 'Microsoft.VC*.CRT' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Parent.Name -eq 'x64' } | Select-Object -First 1
          if (-not $crt) { throw "x64 Microsoft.VC*.CRT folder not found under $redistRoot" }
          $runtimeDlls = Get-ChildItem $crt.FullName -File | Where-Object { $_.Name -like 'msvcp140*.dll' -or $_.Name -like 'vcruntime140*.dll' -or $_.Name -eq 'concrt140.dll' }
          foreach ($pattern in @('msvcp140*.dll', 'vcruntime140*.dll', 'concrt140.dll')) {
            if (-not ($runtimeDlls | Where-Object { $_.Name -like $pattern })) { throw "Required MSVC runtime file not found: $pattern in $($crt.FullName)" }
          }
          foreach ($dll in $runtimeDlls) { Copy-Item $dll.FullName $stage }
          Copy-Item "$vlc/libvlc.dll", "$vlc/libvlccore.dll" $stage
          Copy-Item "$vlc/plugins" "$stage/plugins" -Recurse
          Copy-Item LICENSE, NOTICE, assets/icons/LICENSE-hugeicons.txt, assets/fonts/OFL.txt $stage
          Copy-Item LICENSES "$stage/LICENSES" -Recurse
          $qtNotices = "$stage/upstream-notices/qt"
          $vlcNotices = "$stage/upstream-notices/vlc"
          New-Item -ItemType Directory -Force $qtNotices, $vlcNotices | Out-Null
          Get-ChildItem $env:QT_ROOT_DIR -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING)|third.*party|^copyright$' } | ForEach-Object {
            $relative = $_.FullName.Substring($env:QT_ROOT_DIR.Length).TrimStart('\', '/')
            $target = Join-Path $qtNotices $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          Get-ChildItem $vlc -Recurse -File | Where-Object { $_.Name -match '^(COPYING|LICENSE)|^copyright$' } | ForEach-Object {
            $relative = $_.FullName.Substring($vlc.Length).TrimStart('\', '/')
            $target = Join-Path $vlcNotices $relative
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          $qtVersion = $env:QT_VERSION
          $qtSeries = $qtVersion.Substring(0, $qtVersion.LastIndexOf('.'))
          "Qt $qtVersion`nCorresponding source: https://download.qt.io/archive/qt/$qtSeries/$qtVersion/single/qt-everywhere-src-$qtVersion.tar.xz`n`nlibVLC and VLC plugins 3.0.23`nCorresponding source: https://download.videolan.org/pub/videolan/vlc/3.0.23/" | Set-Content "$stage/THIRD-PARTY-SOURCES.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath konus-windows.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/vlc AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/konus AppDir/usr/bin/konus
          cp -R /usr/lib/x86_64-linux-gnu/vlc/plugins AppDir/usr/lib/vlc/
          cp /usr/share/doc/libvlc5/copyright AppDir/usr/lib/vlc/COPYRIGHT 2>/dev/null || true
          mkdir -p AppDir/usr/share/konus/LICENSES
          cp -R LICENSES/. AppDir/usr/share/konus/LICENSES/
          cp LICENSE NOTICE assets/icons/LICENSE-hugeicons.txt assets/fonts/OFL.txt AppDir/usr/share/konus/
          qt_notices=AppDir/usr/share/konus/upstream-notices/qt
          vlc_notices=AppDir/usr/share/konus/upstream-notices/vlc
          mkdir -p "$qt_notices" "$vlc_notices"
          if [ -d "$QT_ROOT_DIR/Licenses" ]; then cp -R "$QT_ROOT_DIR/Licenses" "$qt_notices/Licenses"; fi
          while IFS= read -r -d '' file; do
            rel=${file#"$QT_ROOT_DIR/"}; mkdir -p "$qt_notices/$(dirname "$rel")"; cp "$file" "$qt_notices/$rel"
          done < <(find "$QT_ROOT_DIR" -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname '*third*party*' -o -iname 'copyright' \) -print0)
          for doc in /usr/share/doc/libvlc5/copyright /usr/share/doc/vlc-plugin-base/copyright; do
            if [ -f "$doc" ]; then cp "$doc" "$vlc_notices/$(basename "$(dirname "$doc")").copyright"; fi
          done
          vlc_version=$(dpkg-query -W -f='${Version}' libvlc5)
          ubuntu_codename=$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")
          qt_version="$QT_VERSION"
          qt_series=${qt_version%.*}
          printf 'Qt %s\nCorresponding source: https://download.qt.io/archive/qt/%s/%s/single/qt-everywhere-src-%s.tar.xz\n\nlibVLC and VLC plugins %s (Ubuntu %s source package vlc)\nCorresponding source: https://launchpad.net/ubuntu/%s/+source/vlc/%s\n' "$qt_version" "$qt_series" "$qt_version" "$qt_version" "$vlc_version" "$ubuntu_codename" "$ubuntu_codename" "$vlc_version" > AppDir/usr/share/konus/THIRD-PARTY-SOURCES.txt
          printf '[Desktop Entry]\nType=Application\nName=Konus\nExec=konus\nIcon=konus\nCategories=AudioVideo;Player;\n' > AppDir/usr/share/applications/konus.desktop
          cp assets/icons/cone.svg AppDir/usr/share/icons/hicolor/256x256/apps/konus.svg
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mapfile -t vlc_plugins < <(find AppDir/usr/lib/vlc/plugins -type f -name '*.so')
          plugin_args=()
          for plugin in "${vlc_plugins[@]}"; do plugin_args+=(--library "$plugin"); done
          LDAI_OUTPUT=konus-linux.AppImage QML_SOURCES_PATHS=qml ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/konus --library /usr/lib/x86_64-linux-gnu/libvlc.so.5 "${plugin_args[@]}" --desktop-file AppDir/usr/share/applications/konus.desktop --plugin qt --output appimage
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: konus-macos
          path: konus-macos.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: konus-windows
          path: konus-windows.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: konus-linux
          path: konus-linux.AppImage
